; ExtEnd 每格 0.03 秒，範圍 0～0.48；No 為組內排序，UART 以 MapID 核對。
; 新詞音素可留白，保留最後一個 |；由 DSMT 取得發音並儲存後，一鍵工具自動寫回音素。
