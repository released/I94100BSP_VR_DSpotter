; Recognition specification for DSMT. UTF-8 with BOM.
; Language/NativeProject: [Project.alias]; GROUP: [alias.Group_name].
; No=Command|Reward|SGReward|ExtEnd(seconds)|MapID|FastSpeech(Y/N)|Phoneme
; No is zero-based ordering within a group, not the firmware MapID.
; Blank Phoneme asks DSMT to generate pronunciation; successful build writes back candidates.
; Use full-line comments only. The pipe character is reserved.
; 語系及原生工程在 [Project.名稱] 設定；各 [名稱.Group_群組] 維護完整詞條。
